<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="description" content="MORSE LINK — komunikator Morse'a z ChatGPT">
<link rel="manifest" href='data:application/manifest+json,{"name":"MORSE LINK","short_name":"MORSE LINK","start_url":"./","display":"standalone","background_color":"#10131a","theme_color":"#10131a","description":"Komunikator Morse&#39;a z ChatGPT"}'>
<title>MORSE LINK AI</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1b202b;--line:#30394a;--muted:#9ca7b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;overscroll-behavior:none}
button{font:inherit;border:1px solid var(--line);background:#293244;color:white;border-radius:12px;padding:13px 15px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
.primary{background:#dce6ff;color:#111827;border-color:#dce6ff;font-weight:750}
.app{max-width:720px;margin:auto;min-height:100dvh;padding:18px;display:flex;flex-direction:column;gap:14px;justify-content:center}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:19px;letter-spacing:.14em;margin:0}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:99px}
.status{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#e6b76c;flex:none}.dot.on{background:#8ee0b0}.dot.bad{background:#ff8f8f}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;gap:10px}
.help{font-size:12px;line-height:1.5;color:var(--muted)}
#setupLog{font-size:12px;color:var(--muted);min-height:18px;overflow-wrap:anywhere}
#radio{display:none;min-height:100dvh;min-height:100svh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,#202a3d 0,#10131a 72%);align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:20px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#radio.show{display:flex}
#pad{width:min(74vw,360px);height:min(74vw,360px);max-width:360px;max-height:360px;border-radius:50%;border:2px solid #8394b5;background:radial-gradient(circle at 35% 28%,#465675,#26344d 68%,#182131);box-shadow:0 18px 65px #0009,inset 0 2px 18px #ffffff14;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#pad.active{background:radial-gradient(circle at 35% 28%,#7188b1,#394f70 70%,#263650);transform:scale(.985)}
#pad strong{font-size:clamp(20px,5vw,28px);letter-spacing:.15em}
#pad span{font-size:12px;color:#c5d0e5}
#radioStatus{font-size:12px;color:#aab5c8;text-align:center;letter-spacing:.1em}
#codeView{font:16px ui-monospace,monospace;letter-spacing:.12em;min-height:24px;color:#e5ecfa;text-align:center;overflow-wrap:anywhere;max-width:90vw}
#radioHint{font-size:11px;color:#77849b;text-align:center}
#radioActions{display:flex;gap:8px}
#radioActions button{font-size:12px;padding:9px 12px}
</style>
</head>
<body>
<div class="app" id="setup">
  <header><h1>MORSE LINK</h1><span class="tag">GPT DIRECT</span></header>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Wybudzam serwer Render…</span></div>
  <section class="panel">
    <strong>Tryb bezpośredni: Telefon ⇄ ChatGPT</strong>
    <div id="setupLog">Czekaj — jeśli serwer na Renderze spał, start zajmie ok. 50 sekund. Ekran nadawania włączy się sam.</div>
    <button id="vibrate">Test wibracji (Krótka · długa · krótka)</button>
  </section>
</div>

<div id="radio">
  <div id="radioStatus">POŁĄCZONO Z SERWEREM · NADAWAJ</div>
  <button id="pad" aria-label="Krótko naciśnij dla kropki, przytrzymaj dla kreski">
    <strong>NADAJ</strong><span>krótko · / długo —</span>
  </button>
  <div id="codeView">TX — &nbsp; / &nbsp; RX —</div>
  <div id="radioHint">0.85s ciszy = koniec litery · 1.9s = spacja · 3.5s = wyślij do GPT</div>
  <div id="radioActions"><button id="fullscreen">Pełny ekran</button></div>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const DOT_DASH_MS=260,LETTER_GAP_MS=850,WORD_GAP_MS=1900,SEND_GAP_MS=3500;
const BACKEND_URL=location.hostname.endsWith('.onrender.com')?location.origin:'https://letter-scroll.onrender.com';

let socket=null,pressAt=0;
let txLetter='',txWords=[], rxDisplay='';
let txTimer=null,wordTimer=null,sendTimer=null;
let vibrationQueue=Promise.resolve();

const setStatus=(s,k='')=>{$('status').textContent=s;$('dot').className='dot '+k};
const log=s=>$('setupLog').textContent=s;
const setRadioStatus=s=>$('radioStatus').textContent=s;

function showRadio(){
 $('setup').style.display='none';
 $('radio').classList.add('show');
 setRadioStatus('GOTOWY · NADAWAJ MORSEM');
}

function wakeUpBackend(){
 fetch(BACKEND_URL+'/health',{mode:'cors',cache:'no-store'}).catch(()=>{});
}

function currentTxString(){
 const parts=[...txWords];
 if(txLetter)parts.push(txLetter);
 return parts.join(' ');
}

function renderCode(){
 $('codeView').textContent='TX '+(currentTxString()||'—')+'   /   RX '+(rxDisplay||'—');
}

function vibrate(ms){
 if(!navigator.vibrate)return;
 vibrationQueue=vibrationQueue.then(()=>new Promise(resolve=>{
  navigator.vibrate(ms);
  setTimeout(resolve,ms+130);
 })).catch(()=>{});
}

function playWholeReply(packet){
 if(!packet||!Array.isArray(packet.signals))return;
 rxDisplay=packet.replyMorse||'—';
 renderCode();
 setRadioStatus('GPT ODPOWIADA: '+(packet.replyText||''));

 for(const sig of packet.signals){
  if(sig.type==='symbol'&&(sig.symbol==='.'||sig.symbol==='-')){
   vibrate(sig.symbol==='.'?110:330);
  }else if(sig.type==='letter_end'){
   vibrationQueue=vibrationQueue.then(()=>new Promise(r=>setTimeout(r,330)));
  }else if(sig.type==='word_end'){
   vibrationQueue=vibrationQueue.then(()=>new Promise(r=>setTimeout(r,770)));
  }
 }

 vibrationQueue=vibrationQueue.then(()=>{
  setRadioStatus('GOTOWY · NADAWAJ MORSEM');
 });
}

function flushLetter(){
 if(!txLetter)return;
 txWords.push(txLetter);
 txLetter='';
 renderCode();
}

function flushMessageToServer(){
 flushLetter();
 while(txWords[txWords.length-1]==='/')txWords.pop();
 const finalMorse=txWords.join(' ').trim();
 txWords=[];
 renderCode();

 if(!finalMorse||!socket||!socket.connected)return;

 setRadioStatus('WYSYŁAM DO SERWERA…');
 socket.emit('morse_message',{morse:finalMorse},res=>{
  if(!res?.ok){
   setRadioStatus(res?.error||'NIE ROZPOZNANO KODU');
   return;
  }
  setRadioStatus('WYSŁANO ('+res.decodedText+') · CZEKAM NA GPT…');
 });
}

function startPress(){
 if(pressAt)return;
 pressAt=performance.now();
 $('pad').classList.add('active');
 clearTimeout(txTimer);
 clearTimeout(wordTimer);
 clearTimeout(sendTimer);
}

function endPress(){
 if(!pressAt)return;
 const duration=performance.now()-pressAt;
 pressAt=0;
 $('pad').classList.remove('active');

 const symbol=duration>=DOT_DASH_MS?'-':'.';
 txLetter+=symbol;
 rxDisplay='';
 renderCode();
 setRadioStatus('NADAWANIE…');

 clearTimeout(txTimer);
 clearTimeout(wordTimer);
 clearTimeout(sendTimer);

 // Koniec litery po 850 ms
 txTimer=setTimeout(()=>{
  flushLetter();
 },LETTER_GAP_MS);

 // Spacja między słowami po 1900 ms
 wordTimer=setTimeout(()=>{
  flushLetter();
  if(txWords.length&&txWords[txWords.length-1]!=='/'){
   txWords.push('/');
   renderCode();
  }
 },WORD_GAP_MS);

 // Koniec całej wiadomości i wysyłka na serwer po 3500 ms
 sendTimer=setTimeout(()=>{
  flushMessageToServer();
 },SEND_GAP_MS);
}

function init(){
 if(!window.io){
  setStatus('Nie załadowano Socket.IO. Sprawdź internet i odśwież.','bad');
  return;
 }
 wakeUpBackend();
 socket=io(BACKEND_URL,{
  autoConnect:true,
  transports:['polling','websocket'],
  reconnection:true,
  reconnectionAttempts:Infinity,
  reconnectionDelay:1000,
  reconnectionDelayMax:5000,
  timeout:20000
 });

 socket.on('connect',()=>{
  setStatus('Serwer online · połączono','on');
  showRadio();
 });

 socket.on('connect_error',()=>{
  wakeUpBackend();
  setStatus('Render wybudza serwer… czekaj (~50s)','');
 });

 socket.on('disconnect',()=>{
  setStatus('Rozłączono · ponawiam…','bad');
  setRadioStatus('ROZŁĄCZONO · ŁĄCZENIE...');
 });

 socket.on('morse_reply',playWholeReply);
}

$('vibrate').addEventListener('click',()=>{
 if(navigator.vibrate)navigator.vibrate([110,120,330,120,110]);
 else log('Vibration API niedostępne w tej przeglądarce.');
});
$('fullscreen').addEventListener('click',async()=>{
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(_){
  setRadioStatus('Pełny ekran uruchom z menu przeglądarki.');
 }
});

const pad=$('pad');
pad.addEventListener('pointerdown',e=>{e.preventDefault();try{pad.setPointerCapture(e.pointerId);}catch(_){}startPress();});
pad.addEventListener('pointerup',e=>{e.preventDefault();endPress();});
pad.addEventListener('pointercancel',endPress);
pad.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&$('radio').classList.contains('show')){e.preventDefault();startPress();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')endPress();});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if($('radio').classList.contains('show'))e.preventDefault();},{passive:false});
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister())).catch(()=>{});}
init();
})();
</script>
</body>
</html>
